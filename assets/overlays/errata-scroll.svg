<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 134" width="200" height="134">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a98e57"/>
      <stop offset="0.14" stop-color="#e9dcb8"/>
      <stop offset="0.5" stop-color="#f8f0db"/>
      <stop offset="0.86" stop-color="#e9dcb8"/>
      <stop offset="1" stop-color="#a98e57"/>
    </linearGradient>
    <filter id="sh" x="-14%" y="-22%" width="128%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#2a2016" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- a simple band wrapping the border: shallow arc top & bottom, subtle darker
       gradient at the left & right edges (the sides curving away) -->
  <path d="M26 26 Q100 16 174 26 L174 108 Q100 118 26 108 Z"
        fill="url(#band)" stroke="#6f5a2e" stroke-width="3" filter="url(#sh)"/>
</svg>
