<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oddysey2026 — cube editor</title>
<style>
  :root {
    --bg:#16130f; --panel:#1f1b15; --panel2:#2a241b; --ink:#efe7d6; --dim:#a99e86;
    --line:#3a3228; --accent:#c8a24a; --green:#6fae5a; --amber:#d68a3a; --red:#cc5b4a;
    --blue:#5a8fb0;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif;
         background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:16px; padding:10px 16px;
           background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:15px; margin:0; color:var(--accent); letter-spacing:.5px; font-weight:600; }
  .counts { display:flex; gap:14px; font-size:12px; color:var(--dim); }
  .counts b { color:var(--ink); }
  .pill { padding:1px 7px; border-radius:10px; font-size:11px; border:1px solid var(--line); }
  .pill.accepted { color:var(--green); border-color:#3c5230; }
  .pill.errata { color:var(--amber); border-color:#5a4222; }
  .pill.pending { color:var(--dim); }
  main { display:grid; grid-template-columns:300px 1fr; height:calc(100vh - 49px); }
  /* sidebar */
  aside { border-right:1px solid var(--line); overflow:auto; background:var(--panel); }
  .filter { display:flex; gap:4px; padding:8px; position:sticky; top:0; background:var(--panel);
            border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .filter button { flex:1; background:var(--panel2); color:var(--dim); border:1px solid var(--line);
                   border-radius:5px; padding:4px 6px; cursor:pointer; font-size:11px; }
  .filter button.on { color:var(--ink); border-color:var(--accent); }
  #search { width:100%; padding:6px 8px; background:var(--panel2); border:1px solid var(--line);
            color:var(--ink); border-radius:5px; }
  .addrow { display:flex; gap:6px; padding:0 8px 8px; background:var(--panel);
            position:sticky; top:74px; z-index:4; border-bottom:1px solid var(--line); }
  .addrow input { flex:1; min-width:0; padding:6px 8px; background:var(--panel2);
            border:1px solid var(--line); color:var(--ink); border-radius:5px; }
  .addrow button { background:#2c3c22; color:var(--green); border:1px solid #3c5230;
            border-radius:5px; padding:6px 12px; cursor:pointer; }
  ul#list { list-style:none; margin:0; padding:0; }
  ul#list li { padding:6px 10px; border-bottom:1px solid #241f18; cursor:pointer;
               display:flex; align-items:center; gap:6px; }
  ul#list li:hover { background:var(--panel2); }
  ul#list li.sel { background:#332a1c; }
  li .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  li .dot { width:7px; height:7px; border-radius:50%; flex:none; background:#5b5343; }
  li.accepted .dot { background:var(--green); }
  li.errata .dot { background:var(--amber); }
  li .art { font-size:10px; color:var(--blue); flex:none; }
  /* detail */
  section { overflow:auto; padding:22px 28px; }
  .nav { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .nav button { background:var(--panel2); color:var(--ink); border:1px solid var(--line);
                border-radius:5px; padding:5px 10px; cursor:pointer; }
  .pos { color:var(--dim); font-size:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:20px; max-width:1040px; }
  .cardwrap { display:flex; gap:24px; align-items:flex-start; }
  .cardmain { flex:1; min-width:0; }
  .imgwrap { flex:none; width:320px; display:flex; flex-direction:column; gap:8px; }
  .cardimg { width:320px; border-radius:14px; border:1px solid var(--line);
             background:var(--panel2) url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22/>') center/40% no-repeat;
             aspect-ratio:2176/2960; object-fit:contain; opacity:.25; transition:opacity .3s;
             box-shadow:0 6px 22px rgba(0,0,0,.45); }
  .cardimg.loaded { opacity:1; }
  .cardimg.err { opacity:1; border-color:var(--red); }
  .imgctl { display:flex; gap:6px; }
  .imgbtn { flex:1; text-align:center; text-decoration:none; font-size:12px; cursor:pointer;
            background:var(--panel2); color:var(--dim); border:1px solid var(--line);
            border-radius:6px; padding:5px 4px; }
  .imgbtn.on { color:var(--blue); border-color:var(--blue); }
  .imghint { color:var(--dim); font-size:11px; text-align:center; }
  @media (max-width:880px){ .cardwrap{ flex-direction:column-reverse; } .imgwrap{ width:100%; max-width:340px; } .cardimg{ width:100%; } }
  .card h2 { margin:0 0 2px; font-size:22px; }
  .mc { color:var(--dim); font-size:13px; margin-bottom:12px; }
  .tl { font-weight:600; margin-bottom:10px; }
  .otext { white-space:pre-wrap; background:var(--panel2); border:1px solid var(--line);
           border-radius:8px; padding:12px 14px; min-height:40px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
          gap:6px 18px; margin:14px 0; font-size:12px; }
  .grid div b { color:var(--dim); font-weight:500; }
  .badges { display:flex; gap:8px; margin:10px 0; flex-wrap:wrap; }
  .badge { font-size:11px; padding:2px 8px; border-radius:10px; border:1px solid var(--line); color:var(--dim); }
  .badge.on { color:var(--green); border-color:#3c5230; }
  .badge.er { color:var(--amber); border-color:#5a4222; }
  .ov { color:var(--amber); font-size:12px; }
  /* edit mode */
  .editing { color:var(--amber); font-size:12px; margin-bottom:14px; padding:7px 11px;
             background:#3a2c16; border:1px solid #5a4222; border-radius:7px; }
  .editing kbd { background:#241c0e; border:1px solid #5a4222; border-radius:4px; padding:0 5px; }
  .frow { display:grid; grid-template-columns:104px 1fr; gap:12px; align-items:start; margin-bottom:8px; }
  .frow .flab { color:var(--dim); font-size:12px; padding-top:8px; text-align:right; }
  .frow input, .frow textarea { width:100%; background:var(--panel2); color:var(--ink);
              border:1px solid var(--line); border-radius:6px; padding:7px 9px;
              font:13px/1.45 ui-monospace,monospace; resize:vertical; }
  .frow input:focus, .frow textarea:focus { outline:2px solid var(--accent); border-color:var(--accent); }
  #f_name { font-size:17px; font-weight:600; font-family:ui-sans-serif,system-ui,sans-serif; }
  .editbox { margin-top:18px; }
  label.chk { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;
              padding:10px 12px; background:var(--panel2); border:1px solid var(--line);
              border-radius:8px; }
  label.chk input { width:16px; height:16px; }
  textarea { width:100%; background:var(--panel2); color:var(--ink); border:1px solid var(--line);
             border-radius:8px; padding:10px; font:13px/1.5 ui-monospace,monospace; resize:vertical; }
  .actions { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .actions button { padding:9px 16px; border-radius:7px; border:1px solid var(--line);
                    cursor:pointer; font-weight:600; }
  .b-accept { background:#2c3c22; color:var(--green); border-color:#3c5230; }
  .b-errata { background:#3a2c16; color:var(--amber); border-color:#5a4222; }
  .b-reset  { background:var(--panel2); color:var(--dim); }
  .b-remove { background:#3a1f1c; color:var(--red); border-color:#5a2a24; }
  .b-restore{ background:#1f2c3a; color:var(--blue); border-color:#2a4257; }
  ul#list li.removed .nm { text-decoration:line-through; color:var(--dim); }
  .saved { color:var(--green); font-size:12px; opacity:0; transition:opacity .2s; }
  .saved.show { opacity:1; }
  .keys { color:var(--dim); font-size:11px; margin-top:18px; }
  .keys kbd { background:var(--panel2); border:1px solid var(--line); border-radius:4px;
              padding:0 5px; font-family:ui-monospace,monospace; }
  .missing { color:var(--red); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>oddysey2026 · cube editor</h1>
  <div class="counts" id="counts"></div>
</header>
<main>
  <aside>
    <div class="filter">
      <input id="search" placeholder="filter by name / type…">
      <button data-f="all" class="on">all</button>
      <button data-f="pending">pending</button>
      <button data-f="accepted">accepted</button>
      <button data-f="errata">errata</button>
      <button data-f="genai">genai</button>
      <button data-f="removed">removed</button>
    </div>
    <div class="addrow">
      <input id="addname" placeholder="+ add card by exact name…">
      <button id="addbtn">add</button>
    </div>
    <ul id="list"></ul>
  </aside>
  <section>
    <div class="nav">
      <button id="prev">‹ prev</button>
      <button id="next">next ›</button>
      <button id="nextpending">next pending ⏭</button>
      <span class="pos" id="pos"></span>
      <span class="saved" id="saved">saved ✓</span>
    </div>
    <div class="card" id="card"><p class="pos">Loading…</p></div>
    <div class="keys">
      <kbd>a</kbd> accept &nbsp; <kbd>e</kbd> errata &nbsp; <kbd>g</kbd> toggle GenAI art &nbsp;
      <kbd>j</kbd>/<kbd>k</kbd> next/prev &nbsp; <kbd>n</kbd> next pending
    </div>
  </section>
</main>
<script>
let CARDS = [], COUNTS = {}, cur = null, filter = "all", q = "";
let C = null, editMode = false, foilView = false;

async function loadList() {
  const r = await fetch("/api/cards");
  const d = await r.json();
  CARDS = d.cards; COUNTS = d.counts;
  renderCounts(); renderList();
  if (cur === null && CARDS.length) selectId(firstPendingId() ?? CARDS[0].id);
}
function firstPendingId() { return CARDS.find(c => c.decision === "pending")?.id ?? null; }
function renderCounts() {
  document.getElementById("counts").innerHTML =
    `<span>total <b>${COUNTS.total}</b></span>
     <span>pending <b>${COUNTS.pending}</b></span>
     <span class="pill accepted">accepted ${COUNTS.accepted}</span>
     <span class="pill errata">errata ${COUNTS.errata}</span>
     <span>genai-art <b>${COUNTS.genai}</b></span>
     <span>removed <b>${COUNTS.removed}</b></span>`;
}
function visible() {
  return CARDS.filter(c => {
    // removed cards are hidden everywhere except the "removed" filter
    if (filter === "removed") { if (!c.removed) return false; }
    else if (c.removed) return false;
    if (filter === "genai" && !c.genai_art) return false;
    if (["pending","accepted","errata"].includes(filter) && c.decision !== filter) return false;
    if (q) { const s = (c.name + " " + (c.type||"")).toLowerCase(); if (!s.includes(q)) return false; }
    return true;
  });
}
function renderList() {
  const ul = document.getElementById("list");
  ul.innerHTML = "";
  for (const c of visible()) {
    const li = document.createElement("li");
    li.className = c.decision + (c.id === cur ? " sel" : "") + (c.removed ? " removed" : "");
    li.innerHTML = `<span class="dot"></span><span class="nm">${esc(c.name)}</span>` +
                   (c.errata ? `<span class="art" title="has field errata" style="color:var(--amber)">✎</span>` : "") +
                   (c.removed ? `<span class="art" style="color:var(--red)">removed</span>` : c.genai_art ? `<span class="art">✦art</span>` : "");
    li.onclick = () => selectId(c.id);
    ul.appendChild(li);
  }
}
function esc(s){ return (s??"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }

async function selectId(id) {
  cur = id; editMode = false;
  renderList();
  const r = await fetch("/api/card/" + id);
  C = await r.json();
  renderCard();
  const idx = CARDS.findIndex(x => x.id === id);
  document.getElementById("pos").textContent = `${idx+1} / ${CARDS.length}`;
}

// Independently-erratable fields, in Tab order. Name is first so `e` lands there.
const FIELDS = [
  {k:"name",          label:"name",        ta:false},
  {k:"mana_cost",     label:"mana cost",   ta:false},
  {k:"type",          label:"type line",   ta:false},
  {k:"power",         label:"power",       ta:false},
  {k:"toughness",     label:"toughness",   ta:false},
  {k:"loyalty",       label:"loyalty",     ta:false},
  {k:"colors",        label:"colors",      ta:false},
  {k:"keywords",      label:"keywords",    ta:false},
  {k:"produced_mana", label:"produces",    ta:false},
  {k:"oracle_text",   label:"oracle text", ta:true},
];
// effective value = per-field override if present, else the printed value
function fval(k){ return (C.overrides && C.overrides[k]!=null) ? C.overrides[k] : (C[k]??""); }
function isOv(k){ return !!(C.overrides && C.overrides[k]!=null); }
function ovmark(k){ return isOv(k) ? ` <span class="ov" title="errata">✎</span>` : ""; }
function img(){
  const f = foilView ? 1 : 0;
  // cache-bust on every edit (updated_at changes) so the preview reflects the new render
  const v = encodeURIComponent(C.updated_at || "");
  const src = `/api/render/${C.id}?foil=${f}&v=${v}`;
  return `<div class="imgwrap">
    <img class="cardimg" alt="old-frame render" src="${src}"
         onload="this.classList.add('loaded')"
         onerror="this.classList.remove('loaded');this.classList.add('err')">
    <div class="imgctl">
      <button id="foiltog" class="imgbtn ${foilView?'on':''}">✦ foil</button>
      <button id="rerender" class="imgbtn">↻ re-render</button>
      <a class="imgbtn" href="${src}" target="_blank">⤢ full DPI</a>
    </div>
    <div class="imghint">old-frame · ${foilView?'foil':'normal'} · first render ~3s</div>
  </div>`;
}

function renderCard(){
  if (!C) return;
  document.getElementById("card").innerHTML = editMode ? editForm() : viewForm();
  wire();
  if (editMode) { const n=document.getElementById("f_name"); if(n){ n.focus(); n.select(); } }
}

function viewForm(){
  const stats = C.is_creature && (fval("power")!=="")
    ? `<div><b>P/T</b> ${esc(fval("power"))}/${esc(fval("toughness"))}${ovmark("power")}${ovmark("toughness")}</div>` : "";
  const loy = (fval("loyalty")!=="") ? `<div><b>loyalty</b> ${esc(fval("loyalty"))}${ovmark("loyalty")}</div>` : "";
  const nOv = C.overrides ? Object.keys(C.overrides).length : 0;
  return `
  <div class="cardwrap"><div class="cardmain">
    <h2>${esc(fval("name"))}${ovmark("name")}</h2>
    <div class="mc">${esc(fval("mana_cost"))}${ovmark("mana_cost")} ${C.mana_value!=null?`· mv ${C.mana_value}`:""}
        ${C.cube_elo!=null?`· elo ${Math.round(C.cube_elo)}`:""}
        ${C.edhrec_rank!=null?`· edhrec #${C.edhrec_rank}`:""}</div>
    <div class="tl">${esc(fval("type"))}${ovmark("type")}</div>
    ${C.found ? "" : `<div class="missing">⚠ not found in card DB — fields unavailable</div>`}
    <div class="otext">${esc(fval("oracle_text")||"—")}${ovmark("oracle_text")}</div>
    <div class="grid">
      ${stats}${loy}
      ${fval("colors")?`<div><b>colors</b> ${esc(fval("colors"))}${ovmark("colors")}</div>`:""}
      ${fval("keywords")?`<div><b>keywords</b> ${esc(fval("keywords"))}${ovmark("keywords")}</div>`:""}
      ${fval("produced_mana")?`<div><b>produces</b> ${esc(fval("produced_mana"))}${ovmark("produced_mana")}</div>`:""}
      ${C.printings?`<div><b>printings</b> ${esc(C.printings)}</div>`:""}
    </div>
    <div class="badges">
      <span class="badge ${C.decision==='accepted'?'on':''} ${C.decision==='errata'?'er':''}">decision: ${C.decision}</span>
      ${nOv?`<span class="badge er">${nOv} field errata</span>`:""}
      ${C.notes?`<span class="badge">has notes</span>`:""}
      ${C.odyssey_creature?`<span class="badge on">Odyssey-block creature</span>`:""}
      ${C.updated_at?`<span class="badge">edited ${esc(C.updated_at)}</span>`:""}
    </div>
    <div class="editbox">
      <label class="chk"><input type="checkbox" id="genai" ${C.genai_art?"checked":""}>
        GenAI new art in the style of Odyssey-block <i>Magic: the Gathering</i> artists?</label>
      <div class="actions">
        <button class="b-accept" id="b-accept">✓ Accept as-is (a)</button>
        <button class="b-errata" id="b-edit">✎ Edit fields (e)</button>
        <button class="b-reset" id="b-reset">↺ pending</button>
        ${C.removed
          ? `<button class="b-restore" id="b-restore">♻ Restore to cube</button>`
          : `<button class="b-remove" id="b-remove">🗑 Remove from cube</button>`}
      </div>
    </div>
  </div>${img()}</div>`;
}

function editForm(){
  const row = f => {
    const v = esc(fval(f.k));
    const inp = f.ta
      ? `<textarea id="f_${f.k}" rows="5">${v}</textarea>`
      : `<input id="f_${f.k}" type="text" value="${v}">`;
    return `<label class="frow"><span class="flab">${f.label}${ovmark(f.k)}</span>${inp}</label>`;
  };
  return `
  <div class="cardwrap"><div class="cardmain">
    <div class="editing">editing every field independently · <kbd>Tab</kbd> next field · <kbd>Ctrl/⌘+Enter</kbd> save · <kbd>Esc</kbd> cancel</div>
    ${FIELDS.map(row).join("")}
    <label class="frow"><span class="flab">notes</span><textarea id="f_notes" rows="2">${esc(C.notes||"")}</textarea></label>
    <label class="chk" style="margin-top:10px"><input type="checkbox" id="genai" ${C.genai_art?"checked":""}>
      GenAI new art in the style of Odyssey-block <i>Magic: the Gathering</i> artists?</label>
    <div class="actions">
      <button class="b-accept" id="b-save">✓ Save errata</button>
      <button class="b-reset" id="b-cancel">✕ Cancel (Esc)</button>
      <button class="b-reset" id="b-clear">↺ Clear all errata</button>
    </div>
  </div>${img()}</div>`;
}

function wire(){
  const ft = document.getElementById("foiltog");
  if (ft) ft.onclick = () => { foilView = !foilView; renderCard(); };
  const rr = document.getElementById("rerender");
  if (rr) rr.onclick = () => { const im=document.querySelector(".cardimg");
    if(im){ im.classList.remove("loaded"); im.src = `/api/render/${C.id}?foil=${foilView?1:0}&force=1&t=${Date.now()}`; } };
  if (!editMode) {
    const g=document.getElementById("genai");
    if(g) g.onchange = e => save({ genai_art: e.target.checked }, false);
    document.getElementById("b-accept").onclick = () => save({decision:"accepted"}, true);
    document.getElementById("b-edit").onclick = enterEdit;
    const rm = document.getElementById("b-remove");
    if (rm) rm.onclick = async () => { await fetch("/api/remove/"+cur, {method:"POST"}); await loadList(); selectId(cur); };
    const rs = document.getElementById("b-restore");
    if (rs) rs.onclick = async () => { await fetch("/api/restore/"+cur, {method:"POST"}); await loadList(); selectId(cur); };
    document.getElementById("b-reset").onclick = () => save({decision:"pending"}, false);
  } else {
    document.getElementById("b-save").onclick = saveEdits;
    document.getElementById("b-cancel").onclick = () => { editMode=false; renderCard(); };
    document.getElementById("b-clear").onclick = () =>
      save({decision:"accepted", overrides:{}, notes:""}, false);
  }
}
function enterEdit(){ editMode = true; renderCard(); }

function collectOverrides(){
  const ov = {};
  for (const f of FIELDS){
    const el = document.getElementById("f_"+f.k); if(!el) continue;
    if (String(el.value) !== String(C[f.k] ?? "")) ov[f.k] = el.value;
  }
  return ov;
}
async function saveEdits(){
  const ov = collectOverrides();
  const notes = document.getElementById("f_notes")?.value ?? "";
  const genai = document.getElementById("genai")?.checked ?? C.genai_art;
  const hasEdits = Object.keys(ov).length>0 || notes.trim()!=="";
  await save({ decision: hasEdits ? "errata" : C.decision, overrides: ov, notes, genai_art: genai }, false);
}

async function save(patch, advance) {
  if (cur === null) return;
  await fetch("/api/card/" + cur, {
    method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(patch)
  });
  flashSaved();
  // refresh local row + counts without losing scroll
  const r = await fetch("/api/cards"); const d = await r.json();
  CARDS = d.cards; COUNTS = d.counts; renderCounts(); renderList();
  if (advance) nextCard(); else selectId(cur);
}
function flashSaved(){ const s=document.getElementById("saved"); s.classList.add("show");
  setTimeout(()=>s.classList.remove("show"), 700); }

function step(delta) {
  const idx = CARDS.findIndex(c => c.id === cur);
  const n = idx + delta;
  if (n >= 0 && n < CARDS.length) selectId(CARDS[n].id);
}
function nextCard(){ step(1); }
function nextPending() {
  const idx = CARDS.findIndex(c => c.id === cur);
  for (let i = idx+1; i < CARDS.length; i++) if (CARDS[i].decision==="pending") return selectId(CARDS[i].id);
  const p = firstPendingId(); if (p!==null) selectId(p);
}

// nav + filter wiring
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.getElementById("nextpending").onclick = nextPending;
document.querySelectorAll(".filter button").forEach(b =>
  b.onclick = () => { filter = b.dataset.f;
    document.querySelectorAll(".filter button").forEach(x=>x.classList.toggle("on", x===b));
    renderList(); });
document.getElementById("search").oninput = e => { q = e.target.value.toLowerCase(); renderList(); };

async function addCard(){
  const inp = document.getElementById("addname");
  const name = inp.value.trim();
  if (!name) return;
  const btn = document.getElementById("addbtn");
  btn.disabled = true; btn.textContent = "…";
  try {
    const r = await fetch("/api/add", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name}) });
    const d = await r.json();
    if (d.error) { alert("Add failed: " + d.error); }
    else { inp.value = ""; await loadList(); selectId(d.id); }
  } finally { btn.disabled = false; btn.textContent = "add"; }
}
document.getElementById("addbtn").onclick = addCard;
document.getElementById("addname").addEventListener("keydown", e => { if (e.key === "Enter") addCard(); });

document.addEventListener("keydown", e => {
  // Edit-mode global keys work even while focused in a field.
  if (editMode) {
    if (e.key==="Escape") { editMode=false; renderCard(); e.preventDefault(); }
    else if (e.key==="Enter" && (e.ctrlKey||e.metaKey)) { saveEdits(); e.preventDefault(); }
    return;                       // otherwise let typing + native Tab cycling happen
  }
  if (["INPUT","TEXTAREA"].includes(e.target.tagName)) return;
  if (e.key==="a") save({decision:"accepted"}, true);
  else if (e.key==="e") { enterEdit(); e.preventDefault(); }   // prevent 'e' typing into name
  else if (e.key==="g") { const g=document.getElementById("genai"); if(g){ g.checked=!g.checked; save({genai_art:g.checked}, false);} }
  else if (e.key==="j") step(1);
  else if (e.key==="k") step(-1);
  else if (e.key==="n") nextPending();
});

loadList();
</script>
