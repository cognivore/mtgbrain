<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oddysey2026 — cube editor</title>
<style>
  :root {
    --bg:#16130f; --panel:#1f1b15; --panel2:#2a241b; --ink:#efe7d6; --dim:#a99e86;
    --line:#3a3228; --accent:#c8a24a; --green:#6fae5a; --amber:#d68a3a; --red:#cc5b4a;
    --blue:#5a8fb0;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif;
         background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:16px; padding:10px 16px;
           background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:15px; margin:0; color:var(--accent); letter-spacing:.5px; font-weight:600; }
  .counts { display:flex; gap:14px; font-size:12px; color:var(--dim); }
  .counts b { color:var(--ink); }
  .pill { padding:1px 7px; border-radius:10px; font-size:11px; border:1px solid var(--line); }
  .pill.accepted { color:var(--green); border-color:#3c5230; }
  .pill.errata { color:var(--amber); border-color:#5a4222; }
  .pill.pending { color:var(--dim); }
  main { display:grid; grid-template-columns:300px 1fr; height:calc(100vh - 49px); }
  /* sidebar */
  aside { border-right:1px solid var(--line); overflow:auto; background:var(--panel); }
  .filter { display:flex; gap:4px; padding:8px; position:sticky; top:0; background:var(--panel);
            border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .filter button { flex:1; background:var(--panel2); color:var(--dim); border:1px solid var(--line);
                   border-radius:5px; padding:4px 6px; cursor:pointer; font-size:11px; }
  .filter button.on { color:var(--ink); border-color:var(--accent); }
  #search { width:100%; padding:6px 8px; background:var(--panel2); border:1px solid var(--line);
            color:var(--ink); border-radius:5px; }
  ul#list { list-style:none; margin:0; padding:0; }
  ul#list li { padding:6px 10px; border-bottom:1px solid #241f18; cursor:pointer;
               display:flex; align-items:center; gap:6px; }
  ul#list li:hover { background:var(--panel2); }
  ul#list li.sel { background:#332a1c; }
  li .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  li .dot { width:7px; height:7px; border-radius:50%; flex:none; background:#5b5343; }
  li.accepted .dot { background:var(--green); }
  li.errata .dot { background:var(--amber); }
  li .art { font-size:10px; color:var(--blue); flex:none; }
  /* detail */
  section { overflow:auto; padding:22px 28px; }
  .nav { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .nav button { background:var(--panel2); color:var(--ink); border:1px solid var(--line);
                border-radius:5px; padding:5px 10px; cursor:pointer; }
  .pos { color:var(--dim); font-size:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:20px; max-width:1040px; }
  .cardwrap { display:flex; gap:24px; align-items:flex-start; }
  .cardmain { flex:1; min-width:0; }
  .cardimg { width:300px; flex:none; border-radius:14px; border:1px solid var(--line);
             background:var(--panel2); aspect-ratio:488/680; object-fit:contain;
             box-shadow:0 6px 22px rgba(0,0,0,.45); }
  @media (max-width:880px){ .cardwrap{ flex-direction:column-reverse; } .cardimg{ width:100%; max-width:340px; } }
  .card h2 { margin:0 0 2px; font-size:22px; }
  .mc { color:var(--dim); font-size:13px; margin-bottom:12px; }
  .tl { font-weight:600; margin-bottom:10px; }
  .otext { white-space:pre-wrap; background:var(--panel2); border:1px solid var(--line);
           border-radius:8px; padding:12px 14px; min-height:40px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
          gap:6px 18px; margin:14px 0; font-size:12px; }
  .grid div b { color:var(--dim); font-weight:500; }
  .badges { display:flex; gap:8px; margin:10px 0; flex-wrap:wrap; }
  .badge { font-size:11px; padding:2px 8px; border-radius:10px; border:1px solid var(--line); color:var(--dim); }
  .badge.on { color:var(--green); border-color:#3c5230; }
  .editbox { margin-top:18px; }
  label.chk { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;
              padding:10px 12px; background:var(--panel2); border:1px solid var(--line);
              border-radius:8px; }
  label.chk input { width:16px; height:16px; }
  textarea { width:100%; background:var(--panel2); color:var(--ink); border:1px solid var(--line);
             border-radius:8px; padding:10px; font:13px/1.5 ui-monospace,monospace; resize:vertical; }
  .actions { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .actions button { padding:9px 16px; border-radius:7px; border:1px solid var(--line);
                    cursor:pointer; font-weight:600; }
  .b-accept { background:#2c3c22; color:var(--green); border-color:#3c5230; }
  .b-errata { background:#3a2c16; color:var(--amber); border-color:#5a4222; }
  .b-reset  { background:var(--panel2); color:var(--dim); }
  .saved { color:var(--green); font-size:12px; opacity:0; transition:opacity .2s; }
  .saved.show { opacity:1; }
  .keys { color:var(--dim); font-size:11px; margin-top:18px; }
  .keys kbd { background:var(--panel2); border:1px solid var(--line); border-radius:4px;
              padding:0 5px; font-family:ui-monospace,monospace; }
  .missing { color:var(--red); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>oddysey2026 · cube editor</h1>
  <div class="counts" id="counts"></div>
</header>
<main>
  <aside>
    <div class="filter">
      <input id="search" placeholder="filter by name / type…">
      <button data-f="all" class="on">all</button>
      <button data-f="pending">pending</button>
      <button data-f="accepted">accepted</button>
      <button data-f="errata">errata</button>
      <button data-f="genai">genai</button>
    </div>
    <ul id="list"></ul>
  </aside>
  <section>
    <div class="nav">
      <button id="prev">‹ prev</button>
      <button id="next">next ›</button>
      <button id="nextpending">next pending ⏭</button>
      <span class="pos" id="pos"></span>
      <span class="saved" id="saved">saved ✓</span>
    </div>
    <div class="card" id="card"><p class="pos">Loading…</p></div>
    <div class="keys">
      <kbd>a</kbd> accept &nbsp; <kbd>e</kbd> errata &nbsp; <kbd>g</kbd> toggle GenAI art &nbsp;
      <kbd>j</kbd>/<kbd>k</kbd> next/prev &nbsp; <kbd>n</kbd> next pending
    </div>
  </section>
</main>
<script>
let CARDS = [], COUNTS = {}, cur = null, filter = "all", q = "";

async function loadList() {
  const r = await fetch("/api/cards");
  const d = await r.json();
  CARDS = d.cards; COUNTS = d.counts;
  renderCounts(); renderList();
  if (cur === null && CARDS.length) selectId(firstPendingId() ?? CARDS[0].id);
}
function firstPendingId() { return CARDS.find(c => c.decision === "pending")?.id ?? null; }
function renderCounts() {
  document.getElementById("counts").innerHTML =
    `<span>total <b>${COUNTS.total}</b></span>
     <span>pending <b>${COUNTS.pending}</b></span>
     <span class="pill accepted">accepted ${COUNTS.accepted}</span>
     <span class="pill errata">errata ${COUNTS.errata}</span>
     <span>genai-art <b>${COUNTS.genai}</b></span>`;
}
function visible() {
  return CARDS.filter(c => {
    if (filter === "genai" && !c.genai_art) return false;
    if (["pending","accepted","errata"].includes(filter) && c.decision !== filter) return false;
    if (q) { const s = (c.name + " " + (c.type||"")).toLowerCase(); if (!s.includes(q)) return false; }
    return true;
  });
}
function renderList() {
  const ul = document.getElementById("list");
  ul.innerHTML = "";
  for (const c of visible()) {
    const li = document.createElement("li");
    li.className = c.decision + (c.id === cur ? " sel" : "");
    li.innerHTML = `<span class="dot"></span><span class="nm">${esc(c.name)}</span>` +
                   (c.genai_art ? `<span class="art">✦art</span>` : "");
    li.onclick = () => selectId(c.id);
    ul.appendChild(li);
  }
}
function esc(s){ return (s??"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }

async function selectId(id) {
  cur = id;
  renderList();
  const r = await fetch("/api/card/" + id);
  const c = await r.json();
  renderCard(c);
  const idx = CARDS.findIndex(x => x.id === id);
  document.getElementById("pos").textContent = `${idx+1} / ${CARDS.length}`;
}
function renderCard(c) {
  const stats = c.is_creature && (c.power!=null)
    ? `<div><b>P/T</b> ${esc(c.power)}/${esc(c.toughness)}</div>` : "";
  const loy = c.loyalty!=null ? `<div><b>loyalty</b> ${esc(c.loyalty)}</div>` : "";
  document.getElementById("card").innerHTML = `
    <div class="cardwrap"><div class="cardmain">
    <h2>${esc(c.name)}</h2>
    <div class="mc">${esc(c.mana_cost||"")} ${c.mana_value!=null?`· mv ${c.mana_value}`:""}
        ${c.cube_elo!=null?`· elo ${Math.round(c.cube_elo)}`:""}
        ${c.edhrec_rank!=null?`· edhrec #${c.edhrec_rank}`:""}</div>
    <div class="tl">${esc(c.type||"")}</div>
    ${c.found ? "" : `<div class="missing">⚠ not found in card DB — fields unavailable</div>`}
    <div class="otext">${esc(c.oracle_text||"—")}</div>
    <div class="grid">
      ${stats}${loy}
      ${c.colors?`<div><b>colors</b> ${esc(c.colors)}</div>`:""}
      ${c.keywords?`<div><b>keywords</b> ${esc(c.keywords)}</div>`:""}
      ${c.produced_mana?`<div><b>produces</b> ${esc(c.produced_mana)}</div>`:""}
      ${c.printings?`<div><b>printings</b> ${esc(c.printings)}</div>`:""}
    </div>
    <div class="badges">
      <span class="badge ${c.decision==='accepted'?'on':''}">decision: ${c.decision}</span>
      ${c.odyssey_creature?`<span class="badge on">Odyssey-block creature</span>`:""}
      ${c.updated_at?`<span class="badge">edited ${esc(c.updated_at)}</span>`:""}
    </div>
    <div class="editbox">
      <label class="chk"><input type="checkbox" id="genai" ${c.genai_art?"checked":""}>
        GenAI new art in the style of Odyssey-block <i>Magic: the Gathering</i> artists?</label>
      <p style="margin:14px 0 4px;color:var(--dim);font-size:12px">Errata (leave blank to keep card as printed):</p>
      <textarea id="errata" rows="4" placeholder="e.g. ETB mill 3 instead of 1; add: '{T}: …'">${esc(c.errata_text||"")}</textarea>
      <div class="actions">
        <button class="b-accept" id="b-accept">✓ Accept as-is (a)</button>
        <button class="b-errata" id="b-errata">✎ Save errata (e)</button>
        <button class="b-reset" id="b-reset">↺ pending</button>
      </div>
    </div>
    </div>
    <img class="cardimg" alt="card image (Scryfall)" referrerpolicy="no-referrer"
         src="https://api.scryfall.com/cards/named?format=image&version=normal&exact=${encodeURIComponent(c.name)}"
         onerror="this.style.visibility='hidden'">
    </div>`;
  document.getElementById("genai").onchange = e =>
    save({ genai_art: e.target.checked }, false);
  document.getElementById("b-accept").onclick = () =>
    save({ decision:"accepted", errata_text: errataVal() }, true);
  document.getElementById("b-errata").onclick = () =>
    save({ decision:"errata", errata_text: errataVal() }, true);
  document.getElementById("b-reset").onclick = () =>
    save({ decision:"pending" }, false);
}
function errataVal(){ return document.getElementById("errata")?.value ?? ""; }

async function save(patch, advance) {
  if (cur === null) return;
  await fetch("/api/card/" + cur, {
    method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(patch)
  });
  flashSaved();
  // refresh local row + counts without losing scroll
  const r = await fetch("/api/cards"); const d = await r.json();
  CARDS = d.cards; COUNTS = d.counts; renderCounts(); renderList();
  if (advance) nextCard(); else selectId(cur);
}
function flashSaved(){ const s=document.getElementById("saved"); s.classList.add("show");
  setTimeout(()=>s.classList.remove("show"), 700); }

function step(delta) {
  const idx = CARDS.findIndex(c => c.id === cur);
  const n = idx + delta;
  if (n >= 0 && n < CARDS.length) selectId(CARDS[n].id);
}
function nextCard(){ step(1); }
function nextPending() {
  const idx = CARDS.findIndex(c => c.id === cur);
  for (let i = idx+1; i < CARDS.length; i++) if (CARDS[i].decision==="pending") return selectId(CARDS[i].id);
  const p = firstPendingId(); if (p!==null) selectId(p);
}

// nav + filter wiring
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.getElementById("nextpending").onclick = nextPending;
document.querySelectorAll(".filter button").forEach(b =>
  b.onclick = () => { filter = b.dataset.f;
    document.querySelectorAll(".filter button").forEach(x=>x.classList.toggle("on", x===b));
    renderList(); });
document.getElementById("search").oninput = e => { q = e.target.value.toLowerCase(); renderList(); };

document.addEventListener("keydown", e => {
  if (["INPUT","TEXTAREA"].includes(e.target.tagName)) return;
  if (e.key==="a") { save({decision:"accepted", errata_text:errataVal()}, true); }
  else if (e.key==="e") { document.getElementById("errata")?.focus(); }
  else if (e.key==="g") { const g=document.getElementById("genai"); if(g){ g.checked=!g.checked; save({genai_art:g.checked}, false);} }
  else if (e.key==="j") step(1);
  else if (e.key==="k") step(-1);
  else if (e.key==="n") nextPending();
});

loadList();
</script>
</body>
</html>
