<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="%%MANA_CSS%%">
<style>
@font-face { font-family:'matrix'; src:url('%%MATRIX%%'); }
@font-face { font-family:'mplantin'; src:url('%%MPLANTIN%%'); }
%%ITALIC_FACE%%
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:%%W%%px; height:%%H%%px; background:#000; overflow:hidden; }
.face { position:absolute; left:%%BX%%px; top:%%BY%%px; width:%%FW%%px; height:%%FH%%px; }
.layer { position:absolute; left:0; top:0; width:100%; height:100%; }
/* The real cardconjurer Planeswalker frame supplies ALL borders: title pill, the near-full-card
   art window, the type pill, and the bottom-right loyalty shield. The art rides BEHIND the frame
   (the window is transparent); the loyalty abilities sit on translucent alternating panels over
   the lower art, with the plus/minus/neutral cost badges overhanging the panels' left edge. */
.art { position:absolute; left:6.8%; top:10.1%; width:86.4%; height:81.43%; z-index:0;
       background-size:cover; background-position:center top; }
.pw-panels { position:absolute; left:0; top:0; width:100%; height:100%; z-index:1; }
.pw-panel { position:absolute; left:11.67%; width:80.94%; }
.frame { background-size:100% 100%; z-index:2; }
.box { position:absolute; color:#0a0a0a; text-shadow:none; z-index:5; }
.titlerow { left:8.67%; top:3.72%; width:82.67%; height:5.48%; display:flex; align-items:center; }
.titlerow .nm { font-family:'matrix'; font-size:%%TSZ%%px; line-height:1; white-space:nowrap; overflow:hidden; }
.manacost { left:4%; right:7.0%; top:4.55%; height:5.0%; font-size:%%MSZ%%px; z-index:5;
   display:flex; align-items:center; justify-content:flex-end; white-space:nowrap; }
.type { left:8.67%; top:56.25%; width:%%TYW%%; height:5.48%; display:flex; align-items:center;
   font-family:'matrix'; font-size:%%TYSZ%%px; line-height:1; white-space:nowrap; overflow:hidden; }
.setsym { position:absolute; right:6.5%; top:57.0%; width:12%; height:3.81%; overflow:visible; z-index:5; }
/* one loyalty ability — text vertically centred in its panel, left-indented to clear the badge */
.pw-ab { position:absolute; z-index:3; color:#0a0a0a; font-family:'mplantin';
   font-size:%%ABSZ%%px; line-height:1.16; display:flex; flex-direction:column; justify-content:center; }
.pw-ab p { margin:0 0 .26em; }
.pw-ab p:last-child { margin-bottom:0; }
.pw-ab i { font-style:italic; }
.pw-ab .ms-img { width:0.78em; height:0.78em; vertical-align:-0.07em; margin:0 0.02em;
   filter:drop-shadow(-0.022em 0.055em 0.014em rgba(0,0,0,0.6)); }
/* loyalty cost badge (cardconjurer plus/minus/neutral) — overhangs the panel's left edge */
.pw-badge { position:absolute; left:2.8%; width:14%; z-index:4;
   background-size:100% 100%; background-repeat:no-repeat;
   display:flex; align-items:center; justify-content:center;
   font-family:'matrix'; font-size:%%BADGESZ%%px; color:#fff; line-height:1; }
/* starting loyalty in the frame's bottom-right shield */
.pw-loy { position:absolute; left:80.6%; top:90.0%; width:14%; height:4.0%; z-index:5;
   display:flex; align-items:center; justify-content:center;
   font-family:'matrix'; font-size:%%LOYSZ%%px; color:#fff; line-height:1;
   text-shadow:0 2px 3px rgba(0,0,0,0.55); }
.info { position:absolute; left:8.67%; width:68%; text-align:left; color:%%INFOINK%%;
   font-family:'mplantin'; line-height:1; white-space:nowrap; text-shadow:%%INFOSHADOW%%; z-index:5; }
.illus { top:92.0%; font-family:'matrix'; font-size:46px; }
.legal { top:93.6%; font-size:30px; letter-spacing:.01em; }
.ms-img { width:0.78em; height:0.78em; vertical-align:-0.07em; filter:drop-shadow(-0.022em 0.055em 0.014em rgba(0,0,0,0.6)); }
.manacost .ms-img { margin-left:0.07em; vertical-align:-0.02em; }
.manacost span { display:inline-flex; align-items:center; line-height:1; }
</style></head>
<body>
  <div class="face">
    <div class="art" style="background-image:url('%%ART%%')"></div>
    <div class="pw-panels">%%PWPANELS%%</div>
    <div class="layer frame" style="background-image:url('%%FRAME%%')"></div>
    %%PWABILITIES%%
    %%PWBADGES%%
    <div class="pw-loy">%%LOYALTY%%</div>
    <div class="box titlerow"><span class="nm" id="nm">%%NAME%%</span></div>
    <div class="box manacost" id="mana"><span>%%MANA%%</span></div>
    <div class="box type" id="ty">%%TYPE%%</div>
    %%SETSYM%%
    %%ILLUS%%
    <div class="info legal"><span>NOT FOR SALE &nbsp;·&nbsp; &#8482; &amp; &#169; 1993-%%YEAR%% Wizards of the Coast, Inc.</span></div>
  </div>
<script>
function fitOne(el, span){ if(!el) return; const t = span || el;
  let s = parseFloat(getComputedStyle(t).fontSize);
  for(let i=0; i<120 && t.scrollWidth > el.clientWidth && s > 8; i++){ s -= 1; t.style.fontSize = s + 'px'; } }
function fit(){
  fitOne(document.querySelector('.titlerow'), document.getElementById('nm'));
  fitOne(document.getElementById('ty'), null);
  // Every ability panel is a fixed band; shrink ALL ability text uniformly until none overflows
  // its band (so the loyalty abilities share one consistent type size, like a printed walker).
  var abs = Array.prototype.slice.call(document.querySelectorAll('.pw-ab'));
  function overflow(){ return abs.some(function(b){ return b.scrollHeight > b.clientHeight + 1 || b.scrollWidth > b.clientWidth + 1; }); }
  for(var i=0; i<300 && overflow(); i++){
    abs.forEach(function(e){ var s = parseFloat(getComputedStyle(e).fontSize); if(s > 8) e.style.fontSize = (s - 1) + 'px'; });
  }
  document.querySelectorAll('.info').forEach(function(el){ fitOne(el, el.querySelector('span')); });
  document.documentElement.setAttribute('data-fit','done');
}
if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fit); } else { window.onload = fit; }
setTimeout(fit, 1200);
</script>
</body></html>
