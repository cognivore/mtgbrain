<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="%%MANA_CSS%%">
<style>
@font-face { font-family:'matrix'; src:url('%%MATRIX%%'); }
@font-face { font-family:'mplantin'; src:url('%%MPLANTIN%%'); }
%%ITALIC_FACE%%
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:%%W%%px; height:%%H%%px; background:#000; overflow:hidden; }
.face { position:absolute; left:%%BX%%px; top:%%BY%%px; width:%%FW%%px; height:%%FH%%px; }
.layer { position:absolute; left:0; top:0; width:100%; height:100%; }
/* art sits UNDER the self-contained 8th colour frame (transparent art hole). pack8th
   artBounds: x.088 y.12 w.824 h.4348 */
.art { position:absolute; left:8.8%; top:12%; width:82.4%; height:43.48%;
       background-size:cover; background-position:center; }
.frame { background-size:100% 100%; }
/* the separate 8th P/T frame box (pack8th bounds x.7227 y.8796 w.2147 h.0839) */
.ptbox { position:absolute; left:72.27%; top:87.96%; width:21.47%; height:8.39%; z-index:10;
         background-size:100% 100%; background-repeat:no-repeat; }
/* Title / type / P-T text is ALWAYS black in 8ED — the title & type bars are light/silver
   on every colour (incl. black-frame cards). Only the bottom credit line ever goes white. */
.box { position:absolute; color:#0a0a0a; text-shadow:none; }
/* pack8th text fields (fractions of FACE; font px = fraction*FACE_H) */
.titlerow { left:9%; top:6.29%; width:82.4%; height:4.29%; display:flex; align-items:center; }
.titlerow .nm { font-family:'matrix'; font-size:%%TSZ%%px; line-height:1; white-space:nowrap;
   overflow:hidden; }
/* mana row shares the TITLE row's exact vertical bounds so pips sit on the name's line;
   its RIGHT edge is the art-box right edge (pack8th artBounds 0.088+0.824=0.912 → right:8.8%)
   so the rightmost pip lines up with the art window, NOT smooshed against the frame. */
.manacost { left:4%; right:8.8%; top:6.29%; height:4.29%; font-size:%%MSZ%%px;
   display:flex; align-items:center; justify-content:flex-end; white-space:nowrap; }
.type { left:10%; top:57.2%; width:%%TYW%%; height:3.85%; padding-left:%%TYPAD%%;
   display:flex; align-items:center; font-family:'matrix'; font-size:%%TYSZ%%px; line-height:1;
   white-space:nowrap; overflow:hidden; }
/* colour-indicator dot (coloured artifacts / manual-identity cards): a swatch of the
   matching colour frame, decorated with the same keyline + inner-border filter as the
   set symbol. Sits to the LEFT of the type line; type text is indented past it (TYPAD). */
.colorind { position:absolute; overflow:visible; }
/* rules: VERTICALLY CENTRED in the text box (justify-content:center) — the same flex logic
   as the Seventh frame, so short text floats to the middle instead of pinning to the top. */
.rules { left:%%RULESLEFT%%; top:62.77%; width:%%RULESWIDTH%%; height:26.91%;
   display:flex; flex-direction:column; justify-content:center; align-items:flex-start;
   text-align:left; font-family:'mplantin'; font-size:%%RSZ%%px; line-height:1.18; color:#0a0a0a;
   text-shadow:none; }
/* adventure / prepare sub-box: a SELF-CONTAINED MINI 8ED FRAME occupying ONE HALF of the rules
   area (the creature's own rules reflow into the OTHER half, RULESLEFT/RULESWIDTH). Per the real
   "prepared" card, the sub-box has its OWN OUTER FRAME (rounded, double keyline, drop shadow) over
   a parchment fill, holding a CARDNAME-style capsule bar for the spell name+cost, a matching type
   capsule bar, and a centred rules panel. Adventures take the LEFT half; prepared spells the RIGHT
   half (.adv.right) — and the right half STOPS ABOVE the P/T box so nothing overlaps it. */
.adv { position:absolute; left:9.6%; top:61.7%; width:41.4%; height:28.1%; z-index:1;
   display:flex; flex-direction:column; gap:8px; padding:11px 11px 13px; overflow:hidden; color:#0a0a0a;
   background:linear-gradient(180deg,#efe9db 0%,#e4ddca 100%);
   border:4px solid #0b0a06; border-radius:22px;
   box-shadow: inset 0 0 0 2px #c9b079, 0 4px 11px rgba(0,0,0,0.5); }
.adv.right { left:49%; height:25.3%; }   /* right half ends ABOVE the P/T box (top 87.96%) */
/* capsule bar — the 8ED CARDNAME/type bar look: pill ends, silver bevel, DOUBLE keyline (dark
   outer line + light inner line), drop shadow. The "twin bar" cut into the sub-frame's half. */
.adv-cap { position:relative; flex:none; display:flex; align-items:center;
   border:3px solid #0b0a06; border-radius:999px;
   background:linear-gradient(180deg,#ffffff 0%,#f3f0e6 46%,#d8d1bf 100%);
   box-shadow: inset 0 0 0 2px rgba(255,255,255,0.85), inset 0 3px 2px rgba(255,255,255,0.92),
               inset 0 -4px 5px rgba(0,0,0,0.17), 0 2px 4px rgba(0,0,0,0.45); }
.adv-head { justify-content:space-between; gap:8px; padding:7px 20px; }
.adv-title { font-family:'matrix'; font-size:60px; line-height:1; white-space:nowrap; overflow:hidden; }
.adv-mana { font-size:52px; white-space:nowrap; flex:none; }
.adv-type { font-family:'matrix'; font-size:48px; line-height:1; padding:6px 20px;
   white-space:nowrap; overflow:hidden; }
/* rules panel: parchment, and (the 7ED rule) text VERTICALLY CENTRED — short text floats to the
   middle of the panel instead of pinning to the top. */
.adv-rules { flex:1; overflow:hidden; padding:10px 16px;
   border:3px solid #0b0a06; border-radius:12px; background:#f7f3ea;
   font-family:'mplantin'; font-size:62px; line-height:1.16;
   display:flex; flex-direction:column; justify-content:center; align-items:flex-start; text-align:left; }
.adv-rules p { width:100%; margin:0 0 .35em; }
.adv-rules p:last-child { margin-bottom:0; }
.adv-rules i { font-style:italic; }
.adv .ms-img { vertical-align:-0.16em; margin:0 0.02em; }
.rules p { margin:0 0 .42em; width:100%; }
.rules p:last-child { margin-bottom:0; }
.rules i { font-style:italic; }
.rules .flav { font-style:italic; margin:.18em 0 .42em; color:#0a0a0a; }
.rules .flav .up { font-style:normal; }
.pt { left:76.67%; top:89.53%; width:13.67%; height:4.43%; z-index:11;
   display:flex; align-items:center; justify-content:center;
   font-family:'matrix'; font-size:%%PSZ%%px; line-height:1; font-feature-settings:"smcp"; }
.info { position:absolute; left:9.4%; width:81.07%; text-align:left; color:%%INFOINK%%;
   font-family:'mplantin'; line-height:1; white-space:nowrap; text-shadow:%%INFOSHADOW%%; }
.illus { top:92.0%; font-family:'matrix'; font-size:46px; }
.legal { top:93.3%; font-size:30px; letter-spacing:.01em; }
.ms-img { width:0.78em; height:0.78em; vertical-align:-0.14em;
   filter:drop-shadow(1px 1px 0 rgba(0,0,0,0.35)); }
/* pips centred on the line (real 8ED: circles sit just a hair below the name text) */
.manacost .ms-img { margin-left:0.07em; vertical-align:-0.02em; }
.manacost span { display:inline-flex; align-items:center; line-height:1; }
.rules .ms-img { vertical-align:-0.16em; margin:0 0.02em; }
.setsym { position:absolute; right:7%; top:57.0%; width:12%; height:3.7%; overflow:visible; }
</style></head>
<body>
  <div class="face">
    <div class="art" style="background-image:url('%%ART%%')"></div>
    <div class="layer frame" style="background-image:url('%%FRAME%%')"></div>
    %%PTBOXDIV%%
    %%COLORIND%%
    <div class="box titlerow"><span class="nm" id="nm">%%NAME%%</span></div>
    <div class="box manacost" id="mana"><span>%%MANA%%</span></div>
    <div class="box type" id="ty">%%TYPE%%</div>
    %%SETSYM%%
    <div class="box rules" id="rules">%%RULES%%</div>
    %%ADVBOX%%
    %%PT%%
    %%ILLUS%%
    <div class="info legal"><span>NOT FOR SALE &nbsp;·&nbsp; &#8482; &amp; &#169; 1993-%%YEAR%% Wizards of the Coast, Inc.</span></div>
  </div>
<script>
function fitOneLine(el, span){
  if(!el) return; const t = span || el;
  let s = parseFloat(getComputedStyle(t).fontSize);
  for(let i=0; i<120 && t.scrollWidth > el.clientWidth && s > 8; i++){ s -= 1; t.style.fontSize = s + 'px'; }
}
function fitBox(el){
  if(!el) return; let s = parseFloat(getComputedStyle(el).fontSize);
  for(let i=0; i<140 && (el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth) && s > 10; i++){
    s -= 1; el.style.fontSize = s + 'px';
  }
}
function fit(){
  fitOneLine(document.querySelector('.titlerow'), document.getElementById('nm'));
  fitBox(document.getElementById('ty'));
  fitBox(document.getElementById('rules'));
  fitBox(document.querySelector('.adv-rules'));
  fitOneLine(document.querySelector('.adv-title'));
  fitOneLine(document.querySelector('.adv-type'));
  document.querySelectorAll('.info').forEach(function(el){ fitOneLine(el, el.querySelector('span')); });
  const pt = document.querySelector('.pt');
  if(pt) fitOneLine(pt, pt.querySelector('span'));
  document.documentElement.setAttribute('data-fit','done');
}
if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fit); } else { window.onload = fit; }
setTimeout(fit, 1200);
</script>
</body></html>
