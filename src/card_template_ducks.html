<!doctype html><html><head><meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:%%W%%px; height:%%H%%px; background:#000; overflow:hidden;
  font-family:'Helvetica Neue',Arial,sans-serif; }
/* Frameless DuckTales card at MPC size: a plain white face — big art on top (shown whole,
   white around it), a category-coloured type-line bar in the middle, the text box under it,
   and a small collector number in the bottom black margin (Magic-style). No border frame. */
.face { position:absolute; left:%%BX%%px; top:%%BY%%px; width:%%FW%%px; height:%%FH%%px;
  background:#fff; border-radius:12px; overflow:hidden; }
/* NAME: a GENEROUS fixed area (fits two lines). Font starts at one consistent size for every
   card and only shrinks if a name is so long it overflows this box — so names look uniform
   instead of huge-for-short / tiny-for-long. */
.name { position:absolute; left:5%; right:5%; top:2.8%; height:9%; display:flex; align-items:center;
  justify-content:center; text-align:center; font-weight:900; text-transform:uppercase;
  letter-spacing:.01em; font-size:%%NMSZ%%px; line-height:1.05; color:#111; overflow:hidden; }
/* art: tall, centred, shown WHOLE (contain) on a white ground — never cropped */
.art { position:absolute; left:4%; top:12.6%; width:92%; height:43.5%;
  background:#fff center/contain no-repeat; background-image:url('%%ARTURL%%'); }
/* type-line bar (category colour) in the middle */
.type { position:absolute; left:5%; right:5%; top:57.5%; height:6%; background:%%STRIP%%; color:%%INK%%;
  border-radius:8px; display:flex; align-items:center; justify-content:center; text-align:center;
  font-weight:800; text-transform:uppercase; letter-spacing:.03em; font-size:%%TYSZ%%px;
  line-height:1.02; white-space:nowrap; padding:0 3%; }
/* text box under the type line */
.text { position:absolute; left:6%; right:6%; top:64.8%; bottom:5%; color:#111;
  font-size:%%BODYSZ%%px; line-height:1.32; overflow:hidden; }
/* small collector number in the bottom black margin, like a Magic card */
.num { position:absolute; left:5.5%; bottom:0.55%; color:#9a9a9a; font-weight:700;
  font-size:%%NUMSZ%%px; letter-spacing:.02em; }
</style></head>
<body>
  <div class="face">
    <div class="name" id="nm">%%NAME%%</div>
    <div class="art"></div>
    <div class="type" id="ty">%%TYPE%%</div>
    <div class="text" id="tx">%%TEXT%%</div>
  </div>
  <div class="num">%%NUMBER%% / %%TOTAL%%</div>
<script>
// single-line elements (name, type): shrink only on WIDTH overflow.
function fitW(el, minPx){
  if(!el) return; var s=parseFloat(getComputedStyle(el).fontSize);
  for(var i=0;i<220 && el.scrollWidth>el.clientWidth+1 && s>minPx;i++){ s-=2; el.style.fontSize=s+'px'; }
}
// body text wraps: shrink until it fits the box HEIGHT.
function fitH(el, minPx){
  if(!el) return; var s=parseFloat(getComputedStyle(el).fontSize);
  for(var i=0;i<220 && el.scrollHeight>el.clientHeight+1 && s>minPx;i++){ s-=2; el.style.fontSize=s+'px'; }
}
function fit(){
  fitH(document.getElementById('nm'),40);   // name wraps to 2 lines; shrink only if it overflows
  fitW(document.getElementById('ty'),22);
  fitH(document.getElementById('tx'),18);
  document.documentElement.setAttribute('data-fit','done');
}
window.onload=fit; setTimeout(fit,600);
</script>
</body></html>
