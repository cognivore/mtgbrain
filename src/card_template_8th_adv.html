<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="%%MANA_CSS%%">
<style>
@font-face { font-family:'matrix'; src:url('%%MATRIX%%'); }
@font-face { font-family:'mplantin'; src:url('%%MPLANTIN%%'); }
%%ITALIC_FACE%%
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:%%W%%px; height:%%H%%px; background:#000; overflow:hidden; }
.face { position:absolute; left:%%BX%%px; top:%%BY%%px; width:%%FW%%px; height:%%FH%%px; }
.layer { position:absolute; left:0; top:0; width:100%; height:100%; }
/* The real cardconjurer Adventure frame supplies ALL borders: title pill, art window, type pill,
   and the lower OPEN BOOK — a colour-headed sub-spell page on one side, the creature's rules page
   on the other. The art rides BEHIND the frame (transparent window). For a PREPARED spell the whole
   frame is flipped horizontally (colour page → right), and the text columns swap sides to match. */
.art { position:absolute; left:7.67%; top:11.29%; width:84.76%; height:44.29%; z-index:0;
       background-size:cover; background-position:center; }
.frame { background-size:100% 100%; z-index:1; }
.box { position:absolute; color:#0a0a0a; text-shadow:none; z-index:3; }
.titlerow { left:8.54%; top:5.22%; width:82.92%; height:5.43%; display:flex; align-items:center; }
.titlerow .nm { font-family:'matrix'; font-size:%%TSZ%%px; line-height:1; white-space:nowrap; overflow:hidden; }
.manacost { left:4%; right:7.08%; top:5.22%; height:5.43%; font-size:%%MSZ%%px;
   display:flex; align-items:center; justify-content:flex-end; white-space:nowrap; }
.type { left:8.54%; top:56.64%; width:%%TYW%%; height:5.43%; display:flex; align-items:center;
   font-family:'matrix'; font-size:%%TYSZ%%px; line-height:1; white-space:nowrap; overflow:hidden; }
.setsym { position:absolute; right:7.5%; top:57.0%; width:12%; height:3.6%; overflow:visible; z-index:3; }
/* The separate 8th P/T frame box + its base power/toughness (creatures only). */
.ptbox { position:absolute; left:72.27%; top:87.96%; width:21.47%; height:8.39%; z-index:4;
         background-size:100% 100%; background-repeat:no-repeat; }
.pt { position:absolute; left:76.67%; top:89.53%; width:13.67%; height:4.43%; z-index:5;
   display:flex; align-items:center; justify-content:center;
   font-family:'matrix'; font-size:%%PSZ%%px; line-height:1; font-feature-settings:"smcp"; color:#0a0a0a; }
/* --- the open BOOK. Sub-spell page (colour-headed): title+mana row, type row, rules. The header
   text is WHITE (it rides the coloured band); the rules are dark on the page's parchment. --- */
.adv-head { position:absolute; left:%%SUBHX%%; top:63.41%; width:%%SUBHW%%; height:3.4%; z-index:3;
   display:flex; align-items:center; justify-content:space-between; gap:8px; color:#fff;
   font-family:'matrix'; line-height:1; white-space:nowrap; }
.adv-head .adv-title { font-size:%%SUBTSZ%%px; overflow:hidden; }
.adv-head .adv-mana { font-size:%%SUBMSZ%%px; flex:none; }
.adv-type { position:absolute; left:%%SUBHX%%; top:67.89%; width:%%SUBHW%%; height:3.4%; z-index:3;
   display:flex; align-items:center; color:#fff; font-family:'matrix'; font-size:%%SUBTYSZ%%px;
   line-height:1; white-space:nowrap; overflow:hidden; }
.adv-rules { position:absolute; left:%%SUBRX%%; top:73.58%; width:%%SUBRW%%; height:18.0%; z-index:3;
   color:#0a0a0a; font-family:'mplantin'; font-size:%%SBSZ%%px; line-height:1.16;
   display:flex; flex-direction:column; justify-content:center; }
/* the creature's own rules, on the OTHER page (plain parchment). */
.cre-rules { position:absolute; left:%%CRX%%; top:65.0%; width:%%CRW%%; height:23.58%; z-index:3;
   color:#0a0a0a; font-family:'mplantin'; font-size:%%CRSZ%%px; line-height:1.18;
   display:flex; flex-direction:column; justify-content:center; }
.adv-rules p, .cre-rules p { margin:0 0 .3em; }
.adv-rules p:last-child, .cre-rules p:last-child { margin-bottom:0; }
.adv-rules i, .cre-rules i { font-style:italic; }
.adv-rules .ms-img, .cre-rules .ms-img { width:0.78em; height:0.78em; vertical-align:-0.07em;
   margin:0 0.02em; filter:drop-shadow(-0.045em 0.05em 0.014em rgba(0,0,0,0.6)); }
.adv-head .ms-img { width:0.82em; height:0.82em; vertical-align:-0.07em; margin:0 0.02em;
   filter:drop-shadow(-0.045em 0.05em 0.014em rgba(0,0,0,0.6)); }
.info { position:absolute; left:8.54%; width:80%; text-align:left; color:%%INFOINK%%;
   font-family:'mplantin'; line-height:1; white-space:nowrap; text-shadow:%%INFOSHADOW%%; z-index:6; }
.illus { top:94.0%; font-family:'matrix'; font-size:44px; }
.legal { top:95.6%; font-size:28px; letter-spacing:.01em; }
.ms-img { width:0.78em; height:0.78em; vertical-align:-0.07em; filter:drop-shadow(-0.045em 0.05em 0.014em rgba(0,0,0,0.6)); }
.manacost .ms-img { margin-left:0.07em; vertical-align:-0.02em; }
.manacost span { display:inline-flex; align-items:center; line-height:1; }
</style></head>
<body>
  <div class="face">
    <div class="art" style="background-image:url('%%ART%%')"></div>
    <div class="layer frame" style="background-image:url('%%FRAME%%')"></div>
    <div class="box titlerow"><span class="nm" id="nm">%%NAME%%</span></div>
    <div class="box manacost" id="mana"><span>%%MANA%%</span></div>
    <div class="box type" id="ty">%%TYPE%%</div>
    %%SETSYM%%
    <div class="adv-head"><span class="adv-title" id="advt">%%SUBTITLE%%</span><span class="adv-mana">%%SUBMANA%%</span></div>
    <div class="adv-type" id="advty">%%SUBTYPE%%</div>
    <div class="adv-rules" id="advr">%%SUBRULES%%</div>
    <div class="cre-rules" id="crer">%%CRERULES%%</div>
    %%PTBOXDIV%%
    %%PT%%
    %%ILLUS%%
    <div class="info legal"><span>NOT FOR SALE &nbsp;·&nbsp; &#8482; &amp; &#169; 1993-%%YEAR%% Wizards of the Coast, Inc.</span></div>
  </div>
<script>
function fitOne(el, span){ if(!el) return; const t = span || el;
  let s = parseFloat(getComputedStyle(t).fontSize);
  for(let i=0; i<120 && t.scrollWidth > el.clientWidth && s > 8; i++){ s -= 1; t.style.fontSize = s + 'px'; } }
function fitBox(el){ if(!el) return; let s = parseFloat(getComputedStyle(el).fontSize);
  for(let i=0; i<200 && (el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1) && s > 8; i++){
    s -= 1; el.style.fontSize = s + 'px'; } }
function fit(){
  fitOne(document.querySelector('.titlerow'), document.getElementById('nm'));
  fitOne(document.getElementById('ty'), null);
  fitOne(document.getElementById('advty'), null);
  fitOne(document.querySelector('.adv-head'), document.getElementById('advt'));
  fitBox(document.getElementById('advr'));
  fitBox(document.getElementById('crer'));
  document.querySelectorAll('.info').forEach(function(el){ fitOne(el, el.querySelector('span')); });
  document.documentElement.setAttribute('data-fit','done');
}
if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fit); } else { window.onload = fit; }
setTimeout(fit, 1200);
</script>
</body></html>
