<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="%%MANA_CSS%%">
<style>
@font-face { font-family:'matrix'; src:url('%%MATRIX%%'); }
@font-face { font-family:'mplantin'; src:url('%%MPLANTIN%%'); }
%%ITALIC_FACE%%
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:%%W%%px; height:%%H%%px; background:#000; overflow:hidden; }
.face { position:absolute; left:%%BX%%px; top:%%BY%%px; width:%%FW%%px; height:%%FH%%px; }
.layer { position:absolute; left:0; top:0; width:100%; height:100%; }
/* M15 DEVOID (Eldrazi colourless) frame — its own geometry, NOT the 8th one. Art window
   measured from the frame's transparent hole: x.0771 y.1134 w.8453 h.4410. The textbox is
   OPAQUE parchment baked into the frame, so rules text is drawn on top. */
.art { position:absolute; left:7.71%; top:11.34%; width:84.53%; height:44.10%;
       background-size:cover; background-position:center; }
.frame { background-size:100% 100%; }
/* devoid P/T box (m15DevoidPT.png) — M15 bottom-right shield */
.ptbox { position:absolute; left:73.4%; top:85.0%; width:18.9%; height:6.0%; z-index:10;
         background-size:100% 100%; background-repeat:no-repeat; }
/* M15 title / type / P-T text is dark on the light devoid bars. */
.box { position:absolute; color:#0a0a0a; text-shadow:none; }
/* M15 title bar sits higher than the 8th one (above the art at 11.34%). */
.titlerow { left:8%; top:4.05%; width:84%; height:4.7%; display:flex; align-items:center; }
.titlerow .nm { font-family:'matrix'; font-size:%%TSZ%%px; line-height:1; white-space:nowrap;
   overflow:hidden; }
.manacost { left:4%; right:7.9%; top:4.05%; height:4.7%; font-size:%%MSZ%%px;
   display:flex; align-items:center; justify-content:flex-end; white-space:nowrap; }
/* M15 type bar sits just below the art (art bottom .5544). */
.type { left:8.6%; top:56.3%; width:%%TYW%%; height:4.0%; padding-left:%%TYPAD%%;
   display:flex; align-items:center; font-family:'matrix'; font-size:%%TYSZ%%px; line-height:1;
   white-space:nowrap; overflow:hidden; }
.colorind { position:absolute; overflow:visible; }
.rules { left:8.8%; top:62.2%; width:82.4%; height:25.6%;
   display:flex; flex-direction:column; justify-content:center; align-items:flex-start;
   text-align:left; font-family:'mplantin'; font-size:%%RSZ%%px; line-height:1.18; color:#0a0a0a;
   text-shadow:none; }
.rules p { margin:0 0 .42em; width:100%; }
.rules p:last-child { margin-bottom:0; }
.rules i { font-style:italic; }
.rules .flav { font-style:italic; margin:.18em 0 .42em; color:#0a0a0a; }
.rules .flav .up { font-style:normal; }
.pt { left:76.2%; top:86.4%; width:14.2%; height:4.5%; z-index:11;
   display:flex; align-items:center; justify-content:center;
   font-family:'matrix'; font-size:%%PSZ%%px; line-height:1; font-feature-settings:"smcp"; }
.info { position:absolute; left:8.8%; width:81.07%; text-align:left; color:%%INFOINK%%;
   font-family:'mplantin'; line-height:1; white-space:nowrap; text-shadow:%%INFOSHADOW%%; }
.illus { top:92.6%; font-family:'matrix'; font-size:46px; }
.legal { top:93.9%; font-size:30px; letter-spacing:.01em; }
.ms-img { width:0.78em; height:0.78em; vertical-align:-0.07em;
   filter:drop-shadow(0.035em 0.045em 0.01em rgba(0,0,0,0.5)); }
.manacost .ms-img { margin-left:0.07em; vertical-align:-0.02em; }
.manacost span { display:inline-flex; align-items:center; line-height:1; }
.rules .ms-img { vertical-align:-0.07em; margin:0 0.02em; }
.setsym { position:absolute; right:7%; top:56.1%; width:12%; height:3.7%; overflow:visible; }
</style></head>
<body>
  <div class="face">
    <div class="art" style="background-image:url('%%ART%%')"></div>
    <div class="layer frame" style="background-image:url('%%FRAME%%')"></div>
    %%PTBOXDIV%%
    %%COLORIND%%
    <div class="box titlerow"><span class="nm" id="nm">%%NAME%%</span></div>
    <div class="box manacost" id="mana"><span>%%MANA%%</span></div>
    <div class="box type" id="ty">%%TYPE%%</div>
    %%SETSYM%%
    <div class="box rules" id="rules">%%RULES%%</div>
    %%PT%%
    %%ILLUS%%
    <div class="info legal"><span>NOT FOR SALE &nbsp;·&nbsp; &#8482; &amp; &#169; 1993-%%YEAR%% Wizards of the Coast, Inc.</span></div>
  </div>
<script>
function fitOneLine(el, span){
  if(!el) return; const t = span || el;
  let s = parseFloat(getComputedStyle(t).fontSize);
  for(let i=0; i<120 && t.scrollWidth > el.clientWidth && s > 8; i++){ s -= 1; t.style.fontSize = s + 'px'; }
}
function fitBox(el){
  if(!el) return; let s = parseFloat(getComputedStyle(el).fontSize);
  for(let i=0; i<140 && (el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth) && s > 10; i++){
    s -= 1; el.style.fontSize = s + 'px';
  }
}
function fit(){
  fitOneLine(document.querySelector('.titlerow'), document.getElementById('nm'));
  fitBox(document.getElementById('ty'));
  fitBox(document.getElementById('rules'));
  document.querySelectorAll('.info').forEach(function(el){ fitOneLine(el, el.querySelector('span')); });
  const pt = document.querySelector('.pt');
  if(pt) fitOneLine(pt, pt.querySelector('span'));
  document.documentElement.setAttribute('data-fit','done');
}
if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fit); } else { window.onload = fit; }
setTimeout(fit, 1200);
</script>
</body></html>
