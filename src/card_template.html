<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="%%MANA_CSS%%">
<style>
@font-face { font-family:'goudy'; src:url('%%GOUDY%%'); }
@font-face { font-family:'mplantin'; src:url('%%MPLANTIN%%'); }
%%ITALIC_FACE%%
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:%%W%%px; height:%%H%%px; background:#000; overflow:hidden; }
.face { position:absolute; left:%%BX%%px; top:%%BY%%px; width:%%FW%%px; height:%%FH%%px; }
.layer { position:absolute; left:0; top:0; width:100%; height:100%; }
.art { position:absolute; left:%%AX%%%; top:%%AY%%%; width:%%AW%%%; height:%%AH%%%;
       background-size:cover; background-position:center; }
.frame { background-size:100% 100%; }
.box { position:absolute; color:#080808; }
/* ===== cardconjurer packSeventh.js exact bounds; SHARP black shadow (no blur) ===== */
.titlerow { left:%%TX%%%; top:%%TY%%%; width:%%TW%%%; height:%%TH%%%; display:flex; align-items:center; }
.titlerow .nm { font-family:'goudy'; font-size:%%TSZ%%px; line-height:1; white-space:nowrap;
   overflow:hidden; color:#f9f7ef; text-shadow:%%SHX%%px %%SHY%%px 0 rgba(0,0,0,0.95); }
/* mana: wide right-aligned box (cc x:0.1067 width:0.8174); pips sit at the title height */
.manacost { left:%%MAX%%%; top:%%MAY%%%; width:%%MAW%%%; height:%%MAH%%px; font-size:%%MSZ%%px;
   display:flex; align-items:center; justify-content:flex-end; white-space:nowrap; }
.type { left:%%TYX%%%; top:%%TYY%%%; width:%%TYW%%%; height:%%TYH%%%;
   display:flex; align-items:center; font-family:'mplantin'; font-weight:bold;
   font-size:%%TYSZ%%px; line-height:1; white-space:nowrap; overflow:hidden; color:#f9f7ef;
   text-shadow:%%SHX%%px %%SHY%%px 0 rgba(0,0,0,0.95); }
.rules { left:%%RX%%%; top:%%RY%%%; width:%%RW%%%; height:%%RH%%%;
   display:flex; flex-direction:column; justify-content:center; align-items:flex-start;
   text-align:left; font-family:'mplantin'; font-size:%%RSZ%%px; line-height:1.16; color:#0a0a0a; }
.rules p { margin:0 0 .42em; width:100%; }
.rules p:last-child { margin-bottom:0; }
.rules i { font-style:italic; }
/* flavor: italic, below rules, with a faint divider rule (real old-frame look) */
.rules .flav { font-style:italic; margin:.1em 0 .42em; }
.rules .flavbar { width:100%; height:0; margin:.34em 0 0; }
.pt { left:%%PX%%%; top:%%PY%%%; width:%%PW%%%; height:4.29%;
   display:flex; align-items:center; justify-content:center;
   font-family:'mplantin'; font-weight:bold; font-size:%%PSZ%%px; line-height:1;
   color:#f9f7ef; text-shadow:%%SHX%%px %%SHY%%px 0 rgba(0,0,0,0.95); }
.info { position:absolute; left:8%; width:84%; text-align:center; color:#f9f7ef;
   font-family:'mplantin'; line-height:1; white-space:nowrap; text-shadow:3px 3px 0 rgba(0,0,0,0.9); }
.illus { top:%%IY%%%; font-size:%%ISZ%%px; }
.legal { top:%%LY%%%; font-size:%%LSZ%%px; letter-spacing:.02em; }
/* Pips are cardconjurer's own mana SVGs (disk + glyph baked in) → exact match.
   Each is drawn at 0.78 of the surrounding font size (cardconjurer's manaSymbol
   width = textSize*0.78), square. Works in the cost row (font MSZ) and inline
   in rules (font RSZ) alike. A faint drop-shadow matches the printed look. */
.ms-img { width:0.78em; height:0.78em; vertical-align:-0.14em;
   filter:drop-shadow(1px 1px 0 rgba(0,0,0,0.35)); }
.manacost .ms-img { margin-left:0.07em; }
.rules .ms-img { vertical-align:-0.16em; margin:0 0.02em; }
.foilstar { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; }
/* set symbol: monocolour silhouette (svg mask) over a solid rarity fill with a thin
   perimeter bevel; a THIN white keyline around it (real old-frame look — not a thick
   halo, not a full metallic gradient). */
.setsym { position:absolute; right:%%SSR%%%; top:%%SSY%%%; width:%%SSW%%%; height:%%SSH%%%;
   filter:
     drop-shadow(2.6px 0 0 #fbfaf3) drop-shadow(-2.6px 0 0 #fbfaf3)
     drop-shadow(0 2.6px 0 #fbfaf3) drop-shadow(0 -2.6px 0 #fbfaf3)
     drop-shadow(1.9px 1.9px 0 #fbfaf3) drop-shadow(-1.9px 1.9px 0 #fbfaf3)
     drop-shadow(1.9px -1.9px 0 #fbfaf3) drop-shadow(-1.9px -1.9px 0 #fbfaf3); }
.setsym-edge, .setsym-i { position:absolute; inset:0;
   -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
   -webkit-mask-position:center; mask-position:center;
   -webkit-mask-size:contain; mask-size:contain; }
.setsym-edge { background:#15110d; }                          /* dark inner border (full shape) */
.setsym-i { transform:scale(0.90); transform-origin:center; } /* monocolour body, shrunk */
/* errata scroll: parchment overlay on the LEFT frame strip, golden-ratio-low */
.errata-scroll { position:absolute; left:%%ESX%%%; top:%%ESY%%%; width:%%ESW%%%; height:%%ESH%%%;
   background-repeat:no-repeat; background-position:left center; background-size:contain;
   pointer-events:none; filter:drop-shadow(3px 4px 4px rgba(0,0,0,0.4)); }
</style></head>
<body>
  <div class="face">
    <div class="art" style="background-image:url('%%ART%%')"></div>
    <div class="layer frame" style="background-image:url('%%FRAME%%')"></div>
    <div class="box titlerow"><span class="nm" id="nm">%%NAME%%</span></div>
    <div class="box manacost" id="mana"><span>%%MANA%%</span></div>
    <div class="box type" id="ty">%%TYPE%%</div>
    %%SETSYM%%
    <div class="box rules" id="rules">%%RULES%%</div>
    %%PT%%
    %%ILLUS%%
    <div class="info legal"><span>NOT FOR SALE &nbsp;·&nbsp; &#8482; &amp; &#169; %%YEAR%% Wizards of the Coast, Inc.</span></div>
    %%SCROLL%%
    %%FOIL%%
  </div>
<script>
function fitOneLine(el, span){
  if(!el) return; const t = span || el;
  let s = parseFloat(getComputedStyle(t).fontSize);
  for(let i=0; i<80 && t.scrollWidth > el.clientWidth && s > 8; i++){ s -= 1; t.style.fontSize = s + 'px'; }
}
function fitBox(el){
  if(!el) return; let s = parseFloat(getComputedStyle(el).fontSize);
  for(let i=0; i<100 && (el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth) && s > 10; i++){
    s -= 1; el.style.fontSize = s + 'px';
  }
}
function fit(){
  fitOneLine(document.querySelector('.titlerow'), document.getElementById('nm'));
  fitBox(document.getElementById('ty'));
  fitBox(document.getElementById('rules'));
  document.querySelectorAll('.info').forEach(function(el){ fitOneLine(el, el.querySelector('span')); });
  const pt = document.querySelector('.pt');
  if(pt) fitOneLine(pt, pt.querySelector('span'));
  document.documentElement.setAttribute('data-fit','done');
}
if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fit); } else { window.onload = fit; }
setTimeout(fit, 1200);
</script>
</body></html>
