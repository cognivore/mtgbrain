<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="%%MANA_CSS%%">
<style>
@font-face { font-family:'matrix'; src:url('%%MATRIX%%'); }
@font-face { font-family:'mplantin'; src:url('%%MPLANTIN%%'); }
%%ITALIC_FACE%%
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:%%W%%px; height:%%H%%px; background:#000; overflow:hidden; }
.face { position:absolute; left:%%BX%%px; top:%%BY%%px; width:%%FW%%px; height:%%FH%%px; }
.layer { position:absolute; left:0; top:0; width:100%; height:100%; }
.frame { background-size:100% 100%; }
.box { position:absolute; color:#0a0a0a; text-shadow:none; }
/* The real cardconjurer Saga frame supplies ALL borders: title pill, the parchment chapter
   column with its gilt lore-spine, the white art window on the right, and the type pill. We only
   overlay text, the art (behind the frame's window), and the chapter numeral stones + dividers. */
.art { position:absolute; left:50%; top:11.24%; width:42.47%; height:72.53%; z-index:0;
       background-size:cover; background-position:center; }
.titlerow { left:8.54%; top:5.0%; width:82.92%; height:5.0%; display:flex; align-items:center; z-index:3; }
.titlerow .nm { font-family:'matrix'; font-size:%%TSZ%%px; line-height:1; white-space:nowrap; overflow:hidden; }
.manacost { left:4%; right:7.0%; top:5.1%; height:5.0%; font-size:%%MSZ%%px; z-index:3;
   display:flex; align-items:center; justify-content:flex-end; white-space:nowrap; }
/* Type bar — cardconjurer's regular-Saga type bounds (y:0.8481, height:0.0543); the text rides
   the bottom marble pill exactly as on a normal card (was a touch high + short before). */
.type { left:8.54%; top:84.81%; width:%%TYW%%; height:5.43%; display:flex; align-items:center; z-index:3;
   font-family:'matrix'; font-size:%%TYSZ%%px; line-height:1; white-space:nowrap; overflow:hidden; }
.setsym { position:absolute; right:6.5%; top:85.0%; width:11%; height:3.5%; overflow:visible; z-index:3; }
/* reminder text — small italics atop the chapter column, vertically CENTRED in its box (the 7ED
   box rule) with generous top breathing room instead of squished against the title pill. */
.saga-reminder { position:absolute; left:8.67%; top:11.6%; width:40.4%; height:16.2%; z-index:2;
   font-family:'mplantin'; font-style:italic; font-size:%%SRSZ%%px; line-height:1.16; color:#0a0a0a;
   display:flex; align-items:center; padding-top:0.6%; }
/* one chapter ability band; top/height set inline per chapter */
.saga-body { position:absolute; left:13.34%; width:35%; z-index:2; color:#0a0a0a;
   font-family:'mplantin'; font-size:%%SBSZ%%px; line-height:1.14;
   display:flex; flex-direction:column; justify-content:center; }
.saga-body p { margin:0 0 .26em; }
.saga-body p:last-child { margin-bottom:0; }
.saga-body i { font-style:italic; }
.saga-body .ms-img { width:0.78em; height:0.78em; vertical-align:-0.07em; margin:0 0.02em;
   filter:drop-shadow(0.035em 0.045em 0.01em rgba(0,0,0,0.5)); }
/* the divider rule between chapter bands (cardconjurer sagaDivider.png) */
.saga-div { position:absolute; left:10%; width:39.47%; height:0.55%; z-index:2;
   background:url('%%DIVIMG%%') no-repeat center; background-size:100% 100%; }
/* the stone roman-numeral marker on the lore-spine (cardconjurer sagaChapter.png) */
.saga-chip { position:absolute; left:3.86%; width:7.87%; height:6.29%; z-index:3;
   background:url('%%CHIPIMG%%') no-repeat center; background-size:100% 100%;
   display:flex; align-items:center; justify-content:center; padding-bottom:0.4%;
   font-family:'matrix'; font-size:%%CHSZ%%px; line-height:1; color:#1c1305; font-feature-settings:"smcp"; }
.info { position:absolute; left:8.7%; width:81.07%; text-align:left; color:%%INFOINK%%;
   font-family:'mplantin'; line-height:1; white-space:nowrap; text-shadow:%%INFOSHADOW%%; z-index:4; }
.illus { top:91.6%; font-family:'matrix'; font-size:46px; }
.legal { top:93.0%; font-size:30px; letter-spacing:.01em; }
.ms-img { width:0.78em; height:0.78em; vertical-align:-0.07em; filter:drop-shadow(0.035em 0.045em 0.01em rgba(0,0,0,0.5)); }
.manacost .ms-img { margin-left:0.07em; vertical-align:-0.02em; }
.manacost span { display:inline-flex; align-items:center; line-height:1; }
</style></head>
<body>
  <div class="face">
    <div class="art" style="background-image:url('%%ART%%')"></div>
    <div class="layer frame" style="background-image:url('%%FRAME%%')"></div>
    %%SAGAROWS%%
    <div class="box titlerow"><span class="nm" id="nm">%%NAME%%</span></div>
    <div class="box manacost" id="mana"><span>%%MANA%%</span></div>
    <div class="box type" id="ty">%%TYPE%%</div>
    %%SETSYM%%
    %%ILLUS%%
    <div class="info legal"><span>NOT FOR SALE &nbsp;·&nbsp; &#8482; &amp; &#169; 1993-%%YEAR%% Wizards of the Coast, Inc.</span></div>
  </div>
<script>
function fitOne(el, span){ if(!el) return; const t = span || el;
  let s = parseFloat(getComputedStyle(t).fontSize);
  for(let i=0; i<120 && t.scrollWidth > el.clientWidth && s > 8; i++){ s -= 1; t.style.fontSize = s + 'px'; } }
function fit(){
  fitOne(document.querySelector('.titlerow'), document.getElementById('nm'));
  fitOne(document.getElementById('ty'), null);
  // Shrink reminder + each chapter body until it no longer overflows its (fixed) band.
  document.querySelectorAll('.saga-reminder,.saga-body').forEach(function(el){
    var s = parseFloat(getComputedStyle(el).fontSize);
    for(var i=0; i<160 && (el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1) && s > 8; i++){
      s -= 1; el.style.fontSize = s + 'px'; }
  });
  document.querySelectorAll('.info').forEach(function(el){ fitOne(el, el.querySelector('span')); });
  document.documentElement.setAttribute('data-fit','done');
}
if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fit); } else { window.onload = fit; }
setTimeout(fit, 1200);
</script>
</body></html>
