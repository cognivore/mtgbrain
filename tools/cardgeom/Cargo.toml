[package]
name = "cardgeom"
version = "0.1.0"
edition = "2021"
description = "Pixel-by-pixel geometry analysis for old-frame MTG card renders vs real scans"
license = "MIT"

# Own workspace root so the parent mtgbrain crate never absorbs this tool.
[workspace]

[[bin]]
name = "card-measure"
path = "src/bin/card_measure.rs"

[[bin]]
name = "card-compare"
path = "src/bin/card_compare.rs"

[[bin]]
name = "card-preview"
path = "src/bin/card_preview.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.release]
opt-level = 2

[[bin]]
name = "card-crop"
path = "src/bin/card_crop.rs"
